name: Publish v1.5.1 release

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/release-v1.5.1.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout tested v1.5.1 commit
        uses: actions/checkout@v4
        with:
          ref: baac1698978eb8367bbed95daf8f1230aba873b5

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build executable
        run: npm run build

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          # Garry's Mod Content Installer Plus v1.5.1

          v1.5.1 is an AI-generated maintenance release focused on making SteamCMD validation and updates reliable for existing content.

          ### Highlights
          - Existing CSS and TF2 content is now always checked through SteamCMD with `app_update ... -validate`
          - SteamCMD downloads and extracts without requiring a separate `7za.exe`
          - Paths containing spaces and `(x86)` are handled safely
          - Transient SteamCMD update failures retry automatically after 30 seconds, up to 3 attempts
          - TF2 stale SteamCMD app metadata can be backed up and refreshed automatically after repeated `state is 0x6` / exit code 8 failures
          - Existing TF2 files are preserved during metadata recovery
          - Installer stays open after success or failure and closes only when Enter is pressed
          - SteamCMD progress parsing now uses the reported percentage directly and is clamped to 0–100%

          ### Tested
          - Existing Counter-Strike: Source validated successfully through SteamCMD
          - Existing Team Fortress 2 recovered from stale manifest metadata and validated successfully through SteamCMD
          - `mount.cfg` and `mountdepots.txt` updated successfully after validation
          - Enter-to-close behavior verified
          - Windows build and automated tests passed

          ### Attribution
          v1.5.1 is an AI-generated fork maintenance update. The changes were primarily generated by OpenAI ChatGPT and reviewed and tested by the repository maintainer.

          Original project: zulc22/CSS-Texture-Installer-Plus
          '@
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          gh release create v1.5.1 bin/gmod-content-installer-plus.exe --repo "${{ github.repository }}" --target baac1698978eb8367bbed95daf8f1230aba873b5 --title "Garry's Mod Content Installer Plus v1.5.1" --notes-file release-notes.md
