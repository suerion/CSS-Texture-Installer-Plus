name: Publish v1.5.0 release

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/release-v1.5.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout tested v1.5.0 commit
        uses: actions/checkout@v4
        with:
          ref: bc5a8d432eddc02ce3d652214561a7a340b9b44a

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build executable
        run: npm run build

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          # Garry's Mod Content Installer Plus v1.5.0
          
          v1.5.0 expands the original CSS Texture Installer Plus into a Garry's Mod content installer for supported Valve games.
          
          ### Highlights
          - Counter-Strike: Source and Team Fortress 2 support
          - Direct SteamCMD downloads
          - Persistent content storage under `garrysmod/content_mounts/`
          - Automatic `mount.cfg` and `mountdepots.txt` handling with backups
          - Existing-content detection to avoid unnecessary re-downloads
          - SteamCMD first-run/self-update retry handling
          - Approximate download and installed sizes shown in the installer
          - GMCI+ branding
          
          ### Tested
          - Fresh CSS download and mount
          - Fresh TF2 download and mount
          - Reuse of already installed CSS and TF2 content
          - Simultaneous CSS + TF2 mounts confirmed through Garry's Mod `path` output
          
          ### Attribution
          v1.5.0 is an AI-generated fork update. The changes were primarily generated by OpenAI ChatGPT and reviewed and tested by the repository maintainer.
          
          Original project: zulc22/CSS-Texture-Installer-Plus
          '@
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          gh release create v1.5.0 bin/gmod-content-installer-plus.exe --repo "${{ github.repository }}" --target bc5a8d432eddc02ce3d652214561a7a340b9b44a --title "Garry's Mod Content Installer Plus v1.5.0" --notes-file release-notes.md