name: Publish v1.5.2 release

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/release-v1.5.2.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout tested v1.5.2 commit
        uses: actions/checkout@v4
        with:
          ref: ee0944fad29b9d771045fe9623100b142ae49aaa

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build executable
        run: npm run build

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          # Garry's Mod Content Installer Plus v1.5.2

          v1.5.2 is an AI-generated maintenance release focused on diagnostics, logging and more reliable Team Fortress 2 recovery.

          ### Highlights
          - Optional GMCI session logging, disabled by default
          - Logs are stored directly under `GarrysMod/gmod-contenlog/`
          - Raw SteamCMD output is included in logs for easier troubleshooting
          - Team Fortress 2 stale-manifest recovery now triggers immediately after the first matching `state is 0x6` / exit-code-8 failure
          - No more three 30-second waits before TF2 metadata refresh
          - Logger runtime tests added to CI
          - README expanded with project attribution, direct links, roadmap and antivirus false-positive guidance
          - Release branding updated to v1.5.2

          ### Timing note
          A full SteamCMD validation/update check can take around **3–4 minutes**, even when most content is already present. SteamCMD may spend about two minutes internally waiting before reporting that an already-installed app is fully installed.

          ### Tested
          - Counter-Strike: Source validation completed successfully
          - Team Fortress 2 validation completed successfully
          - Optional log creation under the Garry's Mod folder verified
          - `mount.cfg` and `mountdepots.txt` updated successfully
          - Enter-to-close behavior verified
          - Windows build and automated tests passed

          ### Antivirus note
          The Windows executable is currently unsigned and may trigger heuristic antivirus detections. During development, Microsoft Defender flagged one GitHub Actions build as `Trojan:Win32/Sabsik.EN.D!ml`. Users should download builds only from this repository and should not disable antivirus protection globally.

          ### Attribution
          v1.5.2 is an AI-generated fork maintenance update. The changes were primarily generated by OpenAI ChatGPT and reviewed and tested by the repository maintainer.

          Original project: zulc22/CSS-Texture-Installer-Plus
          '@
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          gh release create v1.5.2 bin/gmod-content-installer-plus.exe --repo "${{ github.repository }}" --target ee0944fad29b9d771045fe9623100b142ae49aaa --title "Garry's Mod Content Installer Plus v1.5.2" --notes-file release-notes.md
